<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WB Gateway</title>
<style>
  body { font-family: Consolas, monospace; background: #111; color: #ddd; margin: 24px; }
  h1 { font-size: 20px; }
  h2 { font-size: 15px; color: #8ab; }
  table { border-collapse: collapse; margin: 10px 0 24px 0; width: 100%; }
  th, td { border: 1px solid #333; padding: 5px 9px; text-align: left; font-size: 13px; }
  th { background: #1c1c1c; }
  input { background: #1a1a1a; border: 1px solid #444; color: #ddd; padding: 5px; font-family: inherit; }
  button { background: #2a4a5a; border: 0; color: #fff; padding: 6px 14px; cursor: pointer; font-family: inherit; }
  button:hover { background: #38607a; }
  button.del { background: #5a2a2a; }
  button.del:hover { background: #7a3838; }
  .row { margin: 6px 0; }
  #status { color: #ab8; min-height: 18px; margin: 8px 0; }
  .wide { width: 480px; }
  .pkg { color: #9c9; }
  .big-balance { background: #18242c; border: 1px solid #2c4452; border-radius: 6px; padding: 14px 18px; margin: 6px 0 16px 0; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .big-balance .v { font-size: 30px; color: #9eecd1; font-weight: bold; }
  .big-balance .u { font-size: 16px; color: #8ab; }
  .big-balance .lbl { color: #8ab; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
  .big-balance .sub { color: #789; font-size: 13px; }
  a { color: #7ab; }
</style>
</head>
<body>
<h1>WB Gateway</h1>
<div id="status"></div>

<h2>Аккаунты</h2>
<table id="accounts">
  <tr><th>Имя</th><th>Email</th><th>UserId</th><th>Статус</th><th></th></tr>
</table>

<h2>Логин</h2>
<div class="row"><button onclick="login()">Войти через ссылку</button> <span id="loginState"></span></div>

<h2>Общий баланс</h2>
<div class="row"><button onclick="loadQuota()">Обновить баланс</button></div>
<div id="total" class="big-balance"></div>
<table id="quota">
  <tr><th>Пакет</th><th>Осталось</th><th>Использовано</th><th>Всего</th><th>Аккаунтов</th><th>Цикл</th></tr>
</table>

<script>
const API = "";

function el(tag, text) {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  return e;
}

function say(msg) { document.getElementById("status").textContent = msg; }

async function jfetch(url, opts) {
  const r = await fetch(API + url, opts);
  const j = await r.json();
  if (!r.ok) throw new Error((j.error && j.error.message) || r.status);
  return j;
}

async function loadAccounts() {
  const list = await jfetch("/v1/accounts");
  const st = await jfetch("/v1/status");
  const cd = {};
  for (const s of st.accounts) cd[s.name] = s;
  const t = document.getElementById("accounts");
  t.innerHTML = "<tr><th>Имя</th><th>Email</th><th>UserId</th><th>Статус</th><th></th></tr>";
  for (const a of list) {
    const tr = el("tr");
    tr.appendChild(el("td", a.name));
    tr.appendChild(el("td", a.email));
    tr.appendChild(el("td", a.userId));
    const s = cd[a.name];
    const stCell = el("td");
    if (!s || s.ready) {
      stCell.textContent = "готов";
      stCell.style.color = "#9c9";
    } else {
      stCell.textContent = "кулдаун " + fmtH(s.cooldownLeftMs);
      stCell.style.color = "#c96";
    }
    tr.appendChild(stCell);
    const td = el("td");
    const btn = el("button", "удалить");
    btn.className = "del";
    btn.onclick = async () => {
      await jfetch("/v1/accounts/delete", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: a.name }) });
      say("удалён " + a.name);
      loadAccounts();
    };
    td.appendChild(btn);
    tr.appendChild(td);
    t.appendChild(tr);
  }
  if (!list.length) say("нет аккаунтов — добавь токен или залогинься");
}

async function addAccount() {
  const name = document.getElementById("name").value.trim();
  const accessToken = document.getElementById("token").value.trim();
  const refreshToken = document.getElementById("refresh").value.trim();
  if (!accessToken) { say("вставь access token"); return; }
  try {
    const r = await jfetch("/v1/accounts", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name, accessToken, refreshToken }) });
    say("добавлен: " + r.name);
    document.getElementById("token").value = "";
    document.getElementById("refresh").value = "";
    loadAccounts();
  } catch (e) { say("ошибка: " + e.message); }
}

const fmt = (n) => String(Math.round(n * 100) / 100);

function fmtH(ms) {
  const s = Math.ceil(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  if (h > 0) return h + "ч " + m + "м";
  if (m > 0) return m + "м " + (s % 60) + "с";
  return s + "с";
}

let loginPoll = null;
async function login() {
  try {
    const r = await jfetch("/v1/login", { method: "POST" });
    document.getElementById("loginState").textContent = "";
    const a = el("a", "открыть ссылку логина");
    a.href = r.authUrl;
    a.target = "_blank";
    const st = document.getElementById("loginState");
    st.textContent = "";
    st.appendChild(a);
    say("логин запущен, жди входа в браузере...");
    if (loginPoll) clearInterval(loginPoll);
    loginPoll = setInterval(async () => {
      const list = await jfetch("/v1/accounts");
      if (list.length) {
        say("аккаунтов: " + list.length);
        loadAccounts();
      }
    }, 3000);
  } catch (e) { say("ошибка: " + e.message); }
}

async function loadQuota() {
  say("загружаю баланс...");
  try {
    const agg = await jfetch("/v1/quota");
    const t = document.getElementById("total");
    t.innerHTML = "";
    const credits = agg.total || { unit: "credits", remain: 0, used: 0, size: 0 };
    const remain = el("span", fmt(credits.remain));
    remain.className = "v";
    const unit = el("span", credits.unit || "credits");
    unit.className = "u";
    const lbl = el("span", "осталось кредитов");
    lbl.className = "lbl";
    t.appendChild(lbl);
    t.appendChild(remain);
    t.appendChild(unit);
    const used = el("span", "использовано " + fmt(credits.used));
    used.className = "sub";
    t.appendChild(used);
    const size = el("span", "из " + fmt(credits.size));
    size.className = "sub";
    t.appendChild(size);
    const accs = el("span", "аккаунтов: " + agg.accounts + (agg.accountsWithPackages !== undefined ? " (с пакетами: " + agg.accountsWithPackages + ")" : "") + (agg.accountsFailed ? " / ошибок: " + agg.accountsFailed : ""));
    accs.className = "sub";
    t.appendChild(accs);

    const qt = document.getElementById("quota");
    qt.innerHTML = "";
    const h2 = el("tr");
    for (const h of ["Пакет", "Осталось", "Использовано", "Всего", "Аккаунтов", "Цикл"]) h2.appendChild(el("th", h));
    qt.appendChild(h2);
    for (const p of agg.packages) {
      const tr = el("tr");
      const pn = el("td", p.packageName);
      pn.className = "pkg";
      tr.appendChild(pn);
      tr.appendChild(el("td", fmt(p.remain) + " " + (p.unit || "")));
      tr.appendChild(el("td", fmt(p.used)));
      tr.appendChild(el("td", fmt(p.size)));
      tr.appendChild(el("td", String(p.accounts)));
      tr.appendChild(el("td", (p.cycleStart || "?") + " .. " + (p.cycleEnd || "?")));
      qt.appendChild(tr);
    }
    if (!agg.packages.length) {
      const tr = el("tr");
      const td = el("td", "нет активных пакетов");
      td.colSpan = 6;
      tr.appendChild(td);
      qt.appendChild(tr);
    }
    say("баланс обновлён");
  } catch (e) { say("ошибка: " + e.message); }
}

loadAccounts();
</script>
</body>
</html>
