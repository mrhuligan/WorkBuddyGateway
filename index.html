<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>WB Gateway</title>
<style>
  body { font-family: Consolas, monospace; background: #111; color: #ddd; margin: 24px; }
  h1 { font-size: 20px; }
  h2 { font-size: 15px; color: #8ab; }
  table { border-collapse: collapse; margin: 10px 0 24px 0; width: 100%; }
  th, td { border: 1px solid #333; padding: 5px 9px; text-align: left; font-size: 13px; }
  th { background: #1c1c1c; }
  input { background: #1a1a1a; border: 1px solid #444; color: #ddd; padding: 5px; font-family: inherit; }
  button { background: #2a4a5a; border: 0; color: #fff; padding: 6px 14px; cursor: pointer; font-family: inherit; }
  button:hover { background: #38607a; }
  button.del { background: #5a2a2a; }
  button.del:hover { background: #7a3838; }
  .row { margin: 6px 0; }
  #status { color: #ab8; min-height: 18px; margin: 8px 0; }
  .wide { width: 480px; }
  .pkg { color: #9c9; }
</style>
</head>
<body>
<h1>WB Gateway</h1>
<div id="status"></div>

<h2>Аккаунты</h2>
<table id="accounts">
  <tr><th>Имя</th><th>Email</th><th>UserId</th><th></th></tr>
</table>

<h2>Добавить аккаунт</h2>
<div class="row">Имя <input id="name" size="20"> Access token <input id="token" class="wide" placeholder="eyJhbGci..."></div>
<div class="row">Refresh token <input id="refresh" class="wide"> <button onclick="addAccount()">Добавить</button></div>

<h2>Логин через браузер</h2>
<div class="row"><button onclick="login()">Открыть страницу логина</button> <span id="loginState"></span></div>

<h2>Квота</h2>
<div class="row"><button onclick="loadQuota()">Обновить квоту</button></div>
<table id="quota">
  <tr><th>Аккаунт</th><th>Пакет</th><th>Осталось</th><th>Использовано</th><th>Всего</th><th>Цикл</th></tr>
</table>

<script>
const API = "";

function el(tag, text) {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  return e;
}

function say(msg) { document.getElementById("status").textContent = msg; }

async function jfetch(url, opts) {
  const r = await fetch(API + url, opts);
  const j = await r.json();
  if (!r.ok) throw new Error((j.error && j.error.message) || r.status);
  return j;
}

async function loadAccounts() {
  const list = await jfetch("/v1/accounts");
  const t = document.getElementById("accounts");
  t.innerHTML = "<tr><th>Имя</th><th>Email</th><th>UserId</th><th></th></tr>";
  for (const a of list) {
    const tr = el("tr");
    tr.appendChild(el("td", a.name));
    tr.appendChild(el("td", a.email));
    tr.appendChild(el("td", a.userId));
    const td = el("td");
    const btn = el("button", "удалить");
    btn.className = "del";
    btn.onclick = async () => {
      await jfetch("/v1/accounts/delete", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: a.name }) });
      say("удалён " + a.name);
      loadAccounts();
    };
    td.appendChild(btn);
    tr.appendChild(td);
    t.appendChild(tr);
  }
  if (!list.length) say("нет аккаунтов — добавь токен или залогинься");
}

async function addAccount() {
  const name = document.getElementById("name").value.trim();
  const accessToken = document.getElementById("token").value.trim();
  const refreshToken = document.getElementById("refresh").value.trim();
  if (!accessToken) { say("вставь access token"); return; }
  try {
    const r = await jfetch("/v1/accounts", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name, accessToken, refreshToken }) });
    say("добавлен: " + r.name);
    document.getElementById("token").value = "";
    document.getElementById("refresh").value = "";
    loadAccounts();
  } catch (e) { say("ошибка: " + e.message); }
}

let loginPoll = null;
async function login() {
  try {
    const r = await jfetch("/v1/login", { method: "POST" });
    document.getElementById("loginState").textContent = "";
    const a = el("a", "открыть ссылку логина");
    a.href = r.authUrl;
    a.target = "_blank";
    const st = document.getElementById("loginState");
    st.textContent = "";
    st.appendChild(a);
    say("логин запущен, жди входа в браузере...");
    if (loginPoll) clearInterval(loginPoll);
    loginPoll = setInterval(async () => {
      const list = await jfetch("/v1/accounts");
      if (list.length) {
        say("аккаунтов: " + list.length);
        loadAccounts();
      }
    }, 3000);
  } catch (e) { say("ошибка: " + e.message); }
}

async function loadQuota() {
  say("загружаю квоту...");
  try {
    const list = await jfetch("/v1/quota");
    const t = document.getElementById("quota");
    t.innerHTML = "<tr><th>Аккаунт</th><th>Пакет</th><th>Осталось</th><th>Использовано</th><th>Всего</th><th>Цикл</th></tr>";
    for (const acc of list) {
      if (acc.error) {
        const tr = el("tr");
        tr.appendChild(el("td", acc.name));
        const td = el("td");
        td.colSpan = 5;
        td.textContent = "ошибка: " + acc.error;
        td.style.color = "#c66";
        tr.appendChild(td);
        t.appendChild(tr);
        continue;
      }
      for (const p of acc.packages) {
        const tr = el("tr");
        tr.appendChild(el("td", acc.name));
        const pn = el("td", p.packageName);
        pn.className = "pkg";
        tr.appendChild(pn);
        tr.appendChild(el("td", p.remain + " " + p.unit));
        tr.appendChild(el("td", p.used));
        tr.appendChild(el("td", p.size));
        tr.appendChild(el("td", p.cycleStart + " .. " + p.cycleEnd));
        t.appendChild(tr);
      }
      if (!acc.packages.length) {
        const tr = el("tr");
        tr.appendChild(el("td", acc.name));
        const td = el("td");
        td.colSpan = 5;
        td.textContent = "нет активных пакетов";
        tr.appendChild(td);
        t.appendChild(tr);
      }
    }
    say("квота обновлена");
  } catch (e) { say("ошибка: " + e.message); }
}

loadAccounts();
</script>
</body>
</html>
